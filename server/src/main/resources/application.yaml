server:
  port: ${SERVER_PORT:48050}
  servlet:
    context-path: /

spring:
  application:
    name: tradeagent-server
  profiles:
    active: local

  # 文件上传大小限制 (支持大体积 PDF 论文/面试题/工业图纸手册，单文件上限 200MB)
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB

  # 禁用默认的静态 OpenAI 自动装配，交由自研 DynamicModelFactory 动态治理与缓存
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-local-key}
      chat:
        enabled: false
      embedding:
        enabled: false

  # 数据源配置（脱敏，优先从系统环境变量读取，默认本地）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:trade_agent_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1

  # Redis 缓存与原子限流
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

# pgvector 工业级向量数据库 (Docker 容器端口 5433)
pgvector:
  host: ${PGVECTOR_HOST:127.0.0.1}
  port: ${PGVECTOR_PORT:5433}
  database: ${PGVECTOR_DB:postgres}
  username: ${PGVECTOR_USER:postgres}
  password: ${PGVECTOR_PASSWORD:postgres}

# 阿里百炼 DashScope（Embedding / 视觉 OCR / RAG 评测出题）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}

# 温氏智慧养殖 IoT 链路：MQTT 接入 / Kafka 事件 / 飞书预警与日报
iot:
  mqtt:
    enabled: ${IOT_MQTT_ENABLED:false}   # true = 连接 Broker 订阅设备主题
    broker: ${IOT_MQTT_BROKER:tcp://127.0.0.1:1883}
    client-id: ${IOT_MQTT_CLIENT_ID:tradeagent-iot}
    topic: ${IOT_MQTT_TOPIC:wens/farm/+/data}
  kafka:
    enabled: ${IOT_KAFKA_ENABLED:false}  # true = 数据点转发 Kafka（需 spring.kafka.bootstrap-servers）
  summary-cron: ${IOT_SUMMARY_CRON:0 0 23 * * ?}

feishu:
  iot-alert-webhook-url: ${FEISHU_IOT_ALERT_WEBHOOK_URL:}   # 群自定义机器人 Webhook，异常预警卡片
  app-id: ${FEISHU_APP_ID:}                                  # 企业自建应用（日报写 Bitable 用）
  app-secret: ${FEISHU_APP_SECRET:}
  bitable-app-token: ${FEISHU_BITABLE_APP_TOKEN:}
  bitable-table-id: ${FEISHU_BITABLE_TABLE_ID:}

# Cross-Encoder 语义二次精排 (任务七)：DashScope gte-rerank-v2；未配置 Key 或调用失败时自动回退融合排序
rag:
  rerank:
    enabled: ${RAG_RERANK_ENABLED:true}
    model: ${RAG_RERANK_MODEL:gte-rerank-v2}
    endpoint: ${RAG_RERANK_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
    timeout-ms: ${RAG_RERANK_TIMEOUT_MS:4000}

# MyBatis-Plus 严格规范（坚决禁用二级缓存）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false # 严格禁用 MyBatis 二级缓存，规避分布式集群脏读
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 接口文档
agent:
  memory:
    summary:
      # 通过启动进程的环境变量配置，缺少密钥时只使用最近20条历史并提示。
      api-key: ${SUMMARY_API_KEY:}
      base-url: ${SUMMARY_BASE_URL:https://api.deepseek.com/v1}
      model: ${SUMMARY_MODEL:deepseek-chat}

knife4j:
  enable: true
  openapi:
    title: TradeAgent AI 智能体平台接口文档
    description: 工业级外贸全链路 AI 获客与多 Agent 协同系统
    version: 1.0.0

aliyun:
  oss:
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:life-agent-imgsearch}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
